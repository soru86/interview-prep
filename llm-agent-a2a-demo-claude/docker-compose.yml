services:
  ollama:
    image: ollama/ollama:latest
    container_name: mail-a2a-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot sidecar: pulls the model into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: mail-a2a-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling deepseek-r1:1.5b (~1.1 GB, first run only)..."
        ollama pull deepseek-r1:1.5b
        echo "Model ready."
    restart: "no"

volumes:
  ollama_data:
