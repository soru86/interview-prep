[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-mail-notify"
version = "1.0.0"
description = "Multi-agent A2A demo: IMAP mailbox agent notifies WhatsApp via MCP tools and DeepSeek R1 1.5B."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3",
    "mcp>=1.28",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
    "uvicorn>=0.30",
    "starlette>=0.38",
    "msal>=1.31",
]

[project.optional-dependencies]
twilio = ["twilio>=9.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-httpx>=0.30",
]

[project.scripts]
a2a-mail-notify = "a2a_mail_notify.runner:main"
a2a-email-mcp = "a2a_mail_notify.mcp_servers.email_mcp:main"
a2a-whatsapp-mcp = "a2a_mail_notify.mcp_servers.whatsapp_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
