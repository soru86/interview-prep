apiVersion: batch/v1
kind: Job
metadata:
  name: nest-js-demo-automation-test
  namespace: nest-js-demo-ci
  labels:
    app.kubernetes.io/name: nest-js-demo
    app.kubernetes.io/component: automation-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nest-js-demo
        app.kubernetes.io/component: automation-test
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- "${BASE_URL}/api/health" >/dev/null 2>&1; do
                echo "waiting for app at ${BASE_URL}..."
                sleep 5
              done
              echo "app is ready"
          env:
            - name: BASE_URL
              value: AUTOMATION_BASE_URL
      containers:
        - name: automation-test
          image: TEST_RUNNER_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "test:automation"]
          env:
            - name: BASE_URL
              value: AUTOMATION_BASE_URL
            - name: CI
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
