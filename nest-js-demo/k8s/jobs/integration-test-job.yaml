apiVersion: batch/v1
kind: Job
metadata:
  name: nest-js-demo-integration-test
  namespace: nest-js-demo-ci
  labels:
    app.kubernetes.io/name: nest-js-demo
    app.kubernetes.io/component: integration-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nest-js-demo
        app.kubernetes.io/component: integration-test
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 29092; do
                echo "waiting for kafka..."
                sleep 3
              done
              echo "kafka is ready"
      containers:
        - name: integration-test
          image: TEST_RUNNER_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "test:e2e"]
          envFrom:
            - configMapRef:
                name: nest-js-demo-test-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
