apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nest-js-demo.fullname" . }}
  labels:
    {{- include "nest-js-demo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nest-js-demo.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "nest-js-demo.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ default (include "nest-js-demo.fullname" .) .Values.serviceAccount.name }}
      {{- if .Values.seed.enabled }}
      initContainers:
        - name: seed-database
          image: "{{ .Values.testRunner.repository }}:{{ .Values.testRunner.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "seed"]
          envFrom:
            - configMapRef:
                name: {{ include "nest-js-demo.fullname" . }}-config
            - secretRef:
                name: {{ include "nest-js-demo.fullname" . }}-secret
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nest-js-demo.fullname" . }}-config
            - secretRef:
                name: {{ include "nest-js-demo.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nest-js-demo.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
