nameOverride: ""
fullnameOverride: ""

environment: staging

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

testRunner:
  repository: ""
  tag: latest

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
  hosts:
    - host: nest-js-demo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

seed:
  enabled: true

kafka:
  enabled: true
  image: apache/kafka:3.9.1
  brokers: ""
  topic: task.created

config:
  nodeEnv: production
  port: 3000
  databasePath: /app/data/app.sqlite
  jwtExpiresIn: 1d
  corsOrigin: "*"
  kafkaClientId: task-api
  kafkaConsumerGroup: task-consumer

secrets:
  jwtSecret: change-me-in-production

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
