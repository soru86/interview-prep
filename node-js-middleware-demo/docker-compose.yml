services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      TRUST_PROXY: "true"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      SESSION_SECRET: change-me-session-secret-32b
      JWT_SECRET: change-me-jwt-secret-32bytes!!
      JWT_EXPIRES_IN: 1h
      COOKIE_SECURE: "false"
      API_KEY: demo-service-api-key
      METRICS_USER: metrics
      METRICS_PASSWORD: metrics-secret
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 200
      SLOW_DOWN_DELAY_MS: 100
      REQUEST_TIMEOUT_MS: 15000
      MAINTENANCE_MODE: "false"
      BODY_LIMIT: 100kb
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
