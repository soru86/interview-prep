<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node.js Middleware Demo</title>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --accent: #38bdf8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Node.js Middleware Demo</h1>
      <p>
        Static asset served by <code>express.static</code>. API docs live in
        <code>README.md</code> and <code>docs/MIDDLEWARE.md</code>.
      </p>
      <p><a href="/api/health">/api/health</a></p>
    </main>
  </body>
</html>
