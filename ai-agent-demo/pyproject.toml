[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-agent"
version = "1.0.0"
description = "AI agent that processes recruiter emails, matches jobs to your resume, and drafts replies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "google-api-python-client>=2.120",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "openpyxl>=3.1",
    "aiosqlite>=0.20",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "structlog>=24.1",
    "tenacity>=8.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
twilio = ["twilio>=9.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-httpx>=0.30",
]

[project.scripts]
recruiter-agent = "recruiter_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
