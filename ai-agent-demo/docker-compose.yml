services:
  ollama:
    image: ollama/ollama:latest
    container_name: recruiter-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-shot init container: pulls DeepSeek R1 after Ollama is healthy.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling deepseek-r1 model (this may take several minutes)..."
        ollama pull deepseek-r1:8b
        echo "Model ready."
    restart: "no"

volumes:
  ollama_data:
