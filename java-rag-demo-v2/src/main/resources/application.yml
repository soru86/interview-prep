server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: java-rag-demo-v2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:deepseek-r1:1.5b}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    # nomic-embed-text v1.5 natively outputs 768-dim vectors; verified at startup against the live model
    embedding-dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:768}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:300}
    temperature: ${OLLAMA_TEMPERATURE:0.6}
  qdrant:
    host: ${QDRANT_HOST:localhost}
    grpc-port: ${QDRANT_GRPC_PORT:6334}
    http-port: ${QDRANT_HTTP_PORT:6333}
    docs-collection: ${QDRANT_DOCS_COLLECTION:me_war_docs_v2}
    memory-collection: ${QDRANT_MEMORY_COLLECTION:chat_memory_v2}
  rag:
    top-k: ${RAG_TOP_K:5}
    min-score: ${RAG_MIN_SCORE:0.60}
    chunk-size: ${RAG_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:50}
    auto-ingest: ${RAG_AUTO_INGEST:true}
    corpus-path: ${RAG_CORPUS_PATH:data/corpus/middle-east-war-updates-2026.pdf}
  memory:
    short-term-max-messages: ${SHORT_TERM_MAX_MESSAGES:20}
    long-term-top-k: ${LONG_TERM_TOP_K:3}
    long-term-min-score: ${LONG_TERM_MIN_SCORE:0.55}

logging:
  level:
    com.interviewprep.ragdemov2: INFO
    dev.langchain4j: WARN
