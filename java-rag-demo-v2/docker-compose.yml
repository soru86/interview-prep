services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: rag-v2-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant image has no curl/wget; probe the HTTP port with bash
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.9.6
    container_name: rag-v2-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: pulls models into the shared volume, then exits.
  ollama-init:
    image: ollama/ollama:0.9.6
    container_name: rag-v2-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull deepseek-r1:1.5b
        ollama pull nomic-embed-text
        echo "Models pulled."
    restart: "no"

  app:
    build: .
    container_name: rag-v2-app
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-deepseek-r1:1.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      QDRANT_HTTP_PORT: "6333"
      RAG_AUTO_INGEST: ${RAG_AUTO_INGEST:-true}
      RAG_CORPUS_PATH: /app/data/corpus/middle-east-war-updates-2026.pdf
    volumes:
      - corpus_data:/app/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_models:
  corpus_data:
